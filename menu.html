<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1118">
  <title>Menu | Smart Restaurant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
    (() => {
      let theme = "dark";
      try {
        const saved = localStorage.getItem("sr_theme_preference");
        if (saved === "light" || saved === "dark") theme = saved;
      } catch (_) { /* Storage can be unavailable in restricted browser contexts. */ }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css"><script src="core.js" defer></script><script src="qa.js" defer></script><script src="script.js" defer></script>
</head>
<body data-page="menu">
  <nav class="navbar" aria-label="Main navigation"><a class="logo" href="index.html">Smart Restaurant</a><button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button><div class="nav-links"><a href="index.html">Home</a><a class="active" href="menu.html">Menu</a><a href="tables.html">Reserve</a><a href="order-tracking.html">Track Order</a><a href="cart.html" class="cart-link">Cart <span id="cart-badge" class="badge">0</span></a><a href="admin.html">Admin</a><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light mode" aria-pressed="false" title="Switch to light mode"><span class="theme-toggle-icon" aria-hidden="true">☀</span><span class="theme-toggle-label">Light mode</span></button></div></nav>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1" class="page-width page-main">
    <div class="breadcrumb"><a href="index.html">Home</a> › Menu</div>
    <section class="page-intro"><span class="eyebrow">MADE FRESH, ORDERED EASY</span><h1>Our Menu</h1><p>Browse dishes, check availability and add your favourites to the cart.</p></section>
    <section class="menu-tools" aria-label="Menu filters">
      <label class="search-field"><span>⌕</span><input id="menu-search" type="search" placeholder="Search dishes..." aria-label="Search dishes"></label>
      <label class="select-field"><span>Category</span><select id="menu-category"><option value="all">All categories</option><option>Main Course</option><option>Fast Food</option><option>Beverage</option><option>Dessert</option></select></label>
      <label class="checkbox-line"><input id="menu-available-only" type="checkbox"> Available only</label>
    </section>
    <div id="menu-container" aria-live="polite" class="menu-grid"></div>
    <div class="menu-bottom"><a href="cart.html" class="btn btn-primary">View Cart <span id="menu-cart-count" class="button-count">0</span></a></div>
  </main>
  <footer class="footer"><div class="footer-emoji">🍽️ • 👨‍🍳 • 🥄 • 🍕 • ☕</div><p>© 2026 Smart Restaurant</p></footer><div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
